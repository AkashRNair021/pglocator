{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PG Locator | Page Not Found</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <link rel="stylesheet" href="{% static 'css/navbar.css' %}">
</head>
<body class="bg-light d-flex flex-column min-vh-100">

    <div id="navbar-placeholder"></div>

    <main class="flex-grow-1 d-flex align-items-center justify-content-center text-center py-5 mt-5">
        <div class="container">
            <h1 class="display-1 fw-bold text-primary mb-0" style="font-family: 'Outfit', sans-serif;">404</h1>
            <h2 class="fw-bold mb-3">Oops! You seem to be lost.</h2>
            <p class="text-muted lead mb-5 mx-auto" style="max-width: 500px;">The page you are looking for might have been removed, had its name changed, or is temporarily unavailable.</p>
            
            <a href="index.html" class="btn btn-primary btn-lg rounded-pill px-5 fw-bold shadow-sm">
                <i class="bi bi-house-door-fill me-2"></i> Back to Home
            </a>
        </div>
    </main>

    <div id="footer-placeholder"></div>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{% static 'js/data.js' %}"></script>
    <script src="{% static 'js/app.js' %}"></script>
</body>
</html>
