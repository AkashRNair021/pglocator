<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PG Locator | Find PG</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/navbar.css">
    <link rel="stylesheet" href="../css/cards.css">
    <style>
        .filter-sidebar {
            position: sticky;
            top: 100px;
            height: calc(100vh - 120px);
            overflow-y: auto;
            border-right: 1px solid var(--border-color);
            padding-right: 1rem;
        }
        /* Custom Checkboxes */
        .form-check-input:checked {
            background-color: var(--primary-color);
            border-color: var(--primary-color);
        }
        /* Custom Range */
        .form-range::-webkit-slider-thumb {
            background: var(--primary-color);
        }
    </style>
</head>
<body class="bg-light pt-5">

    <div id="navbar-placeholder"></div>

    <main class="container-fluid mt-5 pt-4 px-xl-5">
        <div class="row">
            
            <!-- Sidebar Filters -->
            <aside class="col-lg-3 d-none d-lg-block filter-sidebar">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h5 class="fw-bold mb-0">Filters</h5>
                    <button class="btn btn-sm btn-link text-decoration-none text-muted" onclick="resetFilters()">Clear All</button>
                </div>

                <!-- Search -->
                <div class="mb-4">
                    <input type="text" id="filterSearch" class="form-control rounded-pill shadow-sm" placeholder="Search by name, area...">
                </div>

                <!-- City & Area -->
                <div class="mb-4">
                    <h6 class="fw-bold mb-3">Location</h6>
                    <select id="filterCity" class="form-select mb-2 shadow-sm rounded-3">
                        <option value="">Any City</option>
                        <option value="Bangalore">Bangalore</option>
                        <option value="Mumbai">Mumbai</option>
                        <option value="Pune">Pune</option>
                        <option value="Delhi">Delhi</option>
                    </select>
                </div>

                <!-- Gender -->
                <div class="mb-4">
                    <h6 class="fw-bold mb-3">Category</h6>
                    <div class="d-flex gap-2 flex-wrap">
                        <input type="radio" class="btn-check" name="filterGender" id="genderAny" value="" autocomplete="off" checked>
                        <label class="btn btn-outline-dark rounded-pill btn-sm" for="genderAny">Any</label>

                        <input type="radio" class="btn-check" name="filterGender" id="genderBoys" value="boys" autocomplete="off">
                        <label class="btn btn-outline-primary rounded-pill btn-sm" for="genderBoys">Boys</label>

                        <input type="radio" class="btn-check" name="filterGender" id="genderGirls" value="girls" autocomplete="off">
                        <label class="btn btn-outline-danger rounded-pill btn-sm" for="genderGirls">Girls</label>

                        <input type="radio" class="btn-check" name="filterGender" id="genderUnisex" value="unisex" autocomplete="off">
                        <label class="btn btn-outline-success rounded-pill btn-sm" for="genderUnisex">Unisex</label>
                    </div>
                </div>

                <!-- Rent Range -->
                <div class="mb-4">
                    <h6 class="fw-bold mb-3 d-flex justify-content-between">
                        <span>Rent Range</span>
                        <span id="rentLabel" class="text-primary small">₹0 - ₹20000</span>
                    </h6>
                    <input type="range" class="form-range" id="filterRent" min="0" max="20000" step="500" value="20000">
                </div>

                <!-- Room Type -->
                <div class="mb-4">
                    <h6 class="fw-bold mb-3">Room Type</h6>
                    <select id="filterRoomType" class="form-select shadow-sm rounded-3">
                        <option value="">Any</option>
                        <option value="single">Single Room</option>
                        <option value="shared">Shared Room</option>
                    </select>
                </div>

                <!-- Amenities -->
                <div class="mb-4">
                    <h6 class="fw-bold mb-3">Amenities</h6>
                    <div class="d-flex flex-column gap-2" id="amenitiesFilter">
                        <div class="form-check">
                            <input class="form-check-input filter-amenity" type="checkbox" value="WiFi" id="amenityWifi">
                            <label class="form-check-label text-muted" for="amenityWifi">WiFi</label>
                        </div>
                        <div class="form-check">
                            <input class="form-check-input filter-amenity" type="checkbox" value="Food" id="amenityFood">
                            <label class="form-check-label text-muted" for="amenityFood">Food Included</label>
                        </div>
                        <div class="form-check">
                            <input class="form-check-input filter-amenity" type="checkbox" value="AC" id="amenityAC">
                            <label class="form-check-label text-muted" for="amenityAC">AC</label>
                        </div>
                        <div class="form-check">
                            <input class="form-check-input filter-amenity" type="checkbox" value="Laundry" id="amenityLaundry">
                            <label class="form-check-label text-muted" for="amenityLaundry">Laundry</label>
                        </div>
                        <div class="form-check">
                            <input class="form-check-input filter-amenity" type="checkbox" value="Parking" id="amenityParking">
                            <label class="form-check-label text-muted" for="amenityParking">Parking</label>
                        </div>
                        <div class="form-check">
                            <input class="form-check-input filter-amenity" type="checkbox" value="Security" id="amenitySecurity">
                            <label class="form-check-label text-muted" for="amenitySecurity">Security</label>
                        </div>
                        <div class="form-check">
                            <input class="form-check-input filter-amenity" type="checkbox" value="Power Backup" id="amenityPower">
                            <label class="form-check-label text-muted" for="amenityPower">Power Backup</label>
                        </div>
                    </div>
                </div>
            </aside>

            <!-- Main Content Area -->
            <div class="col-lg-9">
                <!-- Mobile Filter Toggle -->
                <div class="d-lg-none mb-3">
                    <button class="btn btn-outline-primary w-100" type="button" data-bs-toggle="collapse" data-bs-target="#mobileFilters">
                        <i class="bi bi-funnel"></i> Show Filters
                    </button>
                    <!-- Mobile filters would be injected here in a real app, keeping simple for demo -->
                </div>

                <!-- Top Bar (Results count & Sorting) -->
                <div class="d-flex justify-content-between align-items-center mb-4 bg-white p-3 rounded-4 shadow-sm">
                    <div>
                        <h4 class="fw-bold mb-0">Properties</h4>
                        <p class="text-muted small mb-0"><span id="resultsCount">0</span> results found</p>
                    </div>
                    <div class="d-flex align-items-center gap-2">
                        <span class="text-muted small fw-medium text-nowrap">Sort By:</span>
                        <select id="sortSelect" class="form-select form-select-sm border-0 bg-light rounded-3 shadow-none fw-medium" style="min-width: 150px;">
                            <option value="popularity">Popularity</option>
                            <option value="priceLow">Lowest Price</option>
                            <option value="priceHigh">Highest Price</option>
                            <option value="rating">Highest Rating</option>
                        </select>
                    </div>
                </div>

                <!-- Listings Grid -->
                <div class="row g-4" id="listingsContainer">
                    <!-- Cards injected via JS -->
                </div>
            </div>
        </div>
    </main>

    <div id="footer-placeholder"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/data.js"></script>
    <script src="../js/app.js"></script>
    <script src="../js/search.js"></script>
</body>
</html>
