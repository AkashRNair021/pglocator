<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PG Locator | Compare Properties</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/navbar.css">
    <style>
        .compare-table th:first-child, .compare-table td:first-child {
            position: sticky;
            left: 0;
            background-color: #f8fafc;
            z-index: 1;
            font-weight: 600;
            width: 200px;
            box-shadow: 2px 0 5px rgba(0,0,0,0.05);
        }
        .compare-img {
            width: 100%;
            height: 150px;
            object-fit: cover;
            border-radius: 0.5rem;
        }
        .table-responsive {
            background: white;
            border-radius: 1rem;
            box-shadow: var(--shadow-sm);
        }
        .table > :not(caption) > * > * {
            padding: 1rem;
            vertical-align: middle;
        }
    </style>
</head>
<body class="bg-light pt-5">

    <div id="navbar-placeholder"></div>

    <main class="container mt-5 pt-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h2 class="fw-bold mb-0">Compare Properties</h2>
                <p class="text-muted mb-0">Compare up to 3 PG accommodations side-by-side</p>
            </div>
            <a href="listings.html" class="btn btn-outline-primary rounded-pill">
                <i class="bi bi-plus-circle me-1"></i> Add more to compare
            </a>
        </div>

        <div id="compareContainer" class="mt-4">
            <!-- Table will be injected here via JS -->
            <div class="text-center py-5">
                <div class="spinner-border text-primary" role="status">
                    <span class="visually-hidden">Loading...</span>
                </div>
            </div>
        </div>
    </main>

    <div id="footer-placeholder"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/data.js"></script>
    <script src="../js/app.js"></script>
    <script src="../js/compare.js"></script>
</body>
</html>
