<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PG Locator | Manage Users</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/dashboard.css">
    <link rel="stylesheet" href="../css/admin.css">
</head>
<body>

    <div class="admin-wrapper">
        <!-- Sidebar -->
        <aside class="admin-sidebar" id="adminSidebar">
            <div class="admin-sidebar-header">
                <div class="bg-primary text-white rounded d-flex align-items-center justify-content-center" style="width: 35px; height: 35px;">
                    <i class="bi bi-houses-fill"></i>
                </div>
                <h4 class="fw-bold mb-0 text-white">PG Locator</h4>
            </div>
            <div class="px-4 py-3">
                <small class="text-uppercase text-muted fw-bold" style="letter-spacing: 0.1em; font-size: 0.75rem;">Admin Panel</small>
            </div>
            <nav class="admin-nav">
                <a href="admin-dashboard.html" class="admin-nav-link"><i class="bi bi-speedometer2"></i> Dashboard</a>
                <a href="admin-listings.html" class="admin-nav-link"><i class="bi bi-building"></i> Listings</a>
                <a href="#" class="admin-nav-link"><i class="bi bi-person-badge"></i> Owners</a>
                <a href="admin-users.html" class="admin-nav-link active"><i class="bi bi-people"></i> Users</a>
                <a href="#" class="admin-nav-link"><i class="bi bi-gear"></i> Settings</a>
            </nav>
            <div class="position-absolute bottom-0 w-100 p-3">
                <a href="../index.html" class="btn btn-outline-light w-100 rounded-pill"><i class="bi bi-box-arrow-left me-2"></i> Exit Admin</a>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="admin-content">
            <!-- Topbar -->
            <header class="admin-topbar">
                <div class="d-flex align-items-center gap-3">
                    <button class="btn btn-light d-lg-none" onclick="document.getElementById('adminSidebar').classList.toggle('show')">
                        <i class="bi bi-list"></i>
                    </button>
                    <h4 class="fw-bold mb-0">User Management</h4>
                </div>
                <div class="d-flex align-items-center gap-3">
                    <div class="d-flex align-items-center gap-2">
                        <img src="https://ui-avatars.com/api/?name=Admin+User&background=4f46e5&color=fff" class="rounded-circle" width="35" height="35" alt="Admin">
                        <span class="fw-medium d-none d-md-block">Super Admin</span>
                    </div>
                </div>
            </header>

            <!-- Filters and Search -->
            <div class="card border-0 shadow-sm rounded-4 mb-4">
                <div class="card-body p-4 d-flex flex-column flex-md-row justify-content-between gap-3">
                    <div class="d-flex gap-3">
                        <div style="width: 200px;">
                            <select id="statusFilter" class="form-select bg-light border-0 shadow-none">
                                <option value="All">All Statuses</option>
                                <option value="Active">Active</option>
                                <option value="Suspended">Suspended</option>
                            </select>
                        </div>
                    </div>
                    <div class="input-group" style="max-width: 350px;">
                        <span class="input-group-text bg-light border-0"><i class="bi bi-search text-muted"></i></span>
                        <input type="text" id="searchInput" class="form-control bg-light border-0 shadow-none" placeholder="Search name or email...">
                    </div>
                </div>
            </div>

            <!-- Tabs -->
            <ul class="nav nav-pills mb-4 gap-2" id="userTabs" role="tablist">
                <li class="nav-item" role="presentation">
                    <button class="nav-link active rounded-pill px-4" id="users-tab" data-bs-toggle="pill" data-bs-target="#users-panel" type="button" role="tab" onclick="switchTab('user')">Regular Users</button>
                </li>
                <li class="nav-item" role="presentation">
                    <button class="nav-link rounded-pill px-4" id="owners-tab" data-bs-toggle="pill" data-bs-target="#owners-panel" type="button" role="tab" onclick="switchTab('owner')">Property Owners</button>
                </li>
            </ul>

            <!-- Data Table Container -->
            <div class="dashboard-table-container mb-4">
                <div class="table-responsive bg-white">
                    <table class="table dashboard-table mb-0">
                        <thead>
                            <tr>
                                <th>User</th>
                                <th>Email</th>
                                <th>Joined Date</th>
                                <th>Status</th>
                                <th class="text-end">Actions</th>
                            </tr>
                        </thead>
                        <tbody id="usersTableBody">
                            <!-- Injected by JS -->
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- Pagination -->
            <nav aria-label="Users pagination" class="d-flex justify-content-between align-items-center">
                <span class="text-muted small" id="paginationInfo">Showing 1-5 of 10</span>
                <ul class="pagination pagination-sm mb-0" id="paginationControls">
                    <!-- Injected by JS -->
                </ul>
            </nav>

        </main>
    </div>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/admin-users.js"></script>
</body>
</html>
